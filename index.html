<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メカニック計算機</title>
    <style>
        body { font:14px sans-serif; background:#1e1e24; color:#fff; padding:10px; margin:0; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; }
        .card { background:#2a2a35; padding:10px; border-radius:8px; border:1px solid #48485a; margin-bottom:10px; }
        h2, th { color:#ff9f43; margin:0 0 5px 0; border-bottom:2px solid #ff9f43; padding-bottom:3px; }
        .mat h2, .mat th { color:#4cd137; border-bottom-color:#4cd137; }
        .sub { font-weight:bold; background:#3e3e50; padding:2px 6px; margin:8px 0 3px 0; border-radius:4px; font-size:12px; }
        table { width:100%; border-collapse:collapse; }
        td, th { padding:4px 2px; border-bottom:1px solid #48485a; text-align:left; }
        .num { text-align:right; }
        input[type="number"] { width:55px; background:#1e1e24; color:#fff; border:2px solid #48485a; text-align:right; border-radius:4px; font-weight:bold; }
        input[type="number"]:focus { outline:none; border-color:#4cd137; background:#253d24; }
        .box { background:#323242; padding:8px; border-radius:6px; margin-top:8px; font-weight:bold; display:flex; justify-content:space-between; border:1px solid #ff9f43; }
        .mat .box { border-color:#4cd137; }
        .panel { background:#2a2a35; border:2px solid #ff9f43; border-radius:8px; padding:10px; margin-top:10px; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; text-align:center; }
        .p-item { background:#1e1e24; padding:8px; border-radius:6px; }
        .p-item div { font-size:11px; color:#aaa; }
        .p-item span { font-size:16px; font-weight:bold; color:#ff9f43; }
        .p-item.w span { color:#fff; }
        .pad { background:#22222a; border-radius:6px; padding:8px; margin-top:8px; }
        .pad-grid { display:grid; grid-template-columns:1fr 55px; gap:8px; }
        .keys { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; }
        .navs { display:grid; grid-template-rows:1fr 1fr; gap:5px; }
        .rst-area { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
        button { background:#3a3a4a; color:#fff; border:none; padding:8px; font-weight:bold; border-radius:4px; cursor:pointer; }
        button:active { background:#4cd137; }
        button.clr { background:#ff6b6b; }
        button.nav { background:#4a4a5a; font-size:16px; }
        button.rst-chk { background:#e17055; padding:12px; font-size:13px; }
        button.rst-num { background:#d63031; padding:12px; font-size:13px; }
    </style>
</head>
<body>

    <div class="grid">
        <div class="card">
            <h2>修理・整備</h2>
            <table id="t-rep"></table>
            <div style="background:#1e1e24; padding:5px; border-radius:4px; margin-top:8px;"><label><input type="checkbox" id="heli" onchange="calc()"> 出張費 (+1M)</label></div>
            <div class="box"><span>修理 計:</span><span id="v-rep">0</span></div>
        </div>

        <div class="card">
            <h2>性能カスタム</h2>
            <div id="t-cust"></div>
            <div class="box"><span>性能 計:</span><span id="v-cust">0</span></div>
        </div>

        <div class="card">
            <h2>エンジンスワップ</h2>
            <table id="t-swap"></table>
            <div class="box"><span>スワップ 計:</span><span id="v-swap">0</span></div>
        </div>

        <div class="card mat">
            <h2>素材・アイテム買取表</h2>
            <table id="t-mat"></table>
            <div class="box"><span>買取 計:</span><span id="v-mat">0</span></div>
            <div style="color:#ff6b6b; font-size:0.75rem; text-align:center; font-weight:bold; margin-top:5px;">※上記以外買取禁止</div>

            <!-- キーパッドと大きくなったリセットボタン -->
            <div class="pad">
                <div class="pad-grid">
                    <div class="keys">
                        <script>for(let i=1;i<=9;i++) document.write(`<button onclick="pk(${i})">${i}</button>`);</script>
                        <button class="clr" onclick="pc()">C</button><button onclick="pk(0)">0</button><button onclick="pk('00')">00</button>
                    </div>
                    <div class="navs"><button class="nav" onclick="mv(-1)">▲</button><button class="nav" onclick="mv(1)">▼</button></div>
                </div>
                <!-- ここに大きく配置 -->
                <div class="rst-area">
                    <button class="rst-chk" onclick="cr()">CHECK RESET</button>
                    <button class="rst-num" onclick="ar()">NUMBER RESET</button>
                </div>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="p-item"><div>総合計 (出張費含)</div><span id="v-total">0</span></div>
        <div class="p-item w"><div>白市民用 請求額</div><span id="v-civil">0</span></div>
        <div class="p-item w"><div>PD用 請求額(出張無)</div><span id="v-pd">0</span></div>
    </div>

    <script>
        const D = {
            rep: [["エンジン",500000],["サスペンション",150000],["タイヤ",200000],["オイル",50000],["クラッチ",150000],["フィルター",50000],["プラグ",200000],["ブレーキパッド",700000],["タイヤ交換",400000],["EVバッテリー",250000],["EVモーター",500000],["EV冷却液",50000]],
            eng: [["Lv5",10000000],["Lv4",8000000],["Lv3",6000000],["Lv2",4000000],["Lv1",2000000]],
            trans:[["Lv4",5000000],["Lv3",4000000],["Lv2",3000000],["Lv1",2000000]],
            brk: [["Lv3",4000000],["Lv2",3000000],["Lv1",2000000]],
            arm: [["Lv 5",10000000],["Lv 4",8000000],["Lv 3",6000000],["Lv 2",4000000],["Lv 1",2000000]],
            swap:[["V12 (6.0L)",200000000],["V8 (5.4L)",150000000],["V6 (6.0L)",100000000],["I4 (2.0L)",50000000]],
            mat: [["鋼",5000],["鉄",2500],["プラスチック",2500],["アルミ",2500],["ゴム",2500],["ガラス",2500],["銅",2500],["布",2500],["金属スクラップ",2500],["ダクトテープ",50000],["クリーニングキット",50000]]
        };
        let aid = null;

        const rc = (el, arr, p) => el.innerHTML = arr.map((x, i) => `<tr><td style="width:30px;"><input type="checkbox" id="${p}-${i}" onchange="calc()"></td><td><label for="${p}-${i}">${x[0]}</label></td><td class="num">${x[1].toLocaleString()}</td></tr>`).join('');
        rc(document.getElementById('t-rep'), D.rep, 'r');
        rc(document.getElementById('t-swap'), D.swap, 's');

        let cHtml = '';
        [['Engine','eng','e'],['Transmission','trans','t'],['Brake','brk','b'],['Armor','arm','a']].forEach(k => {
            cHtml += `<div class="sub">${k[0]}</div><table>` + D[k[1]].map((x,i) => `<tr><td style="width:30px;"><input type="checkbox" id="${k[2]}-${i}" onchange="calc()"></td><td><label for="${k[2]}-${i}">${x[0]}</label></td><td class="num">${x[1].toLocaleString()}</td></tr>`).join('') + `</table>`;
        });
        document.getElementById('t-cust').innerHTML = cHtml;
        document.getElementById('t-mat').innerHTML = D.mat.map((x, i) => `<tr><td><b>${x[0]}</b></td><td style="text-align:center;"><input type="number" min="0" value="0" id="m-${i}" oninput="calc()" onfocus="aid='m-${i}'"></td><td class="num">${x[1].toLocaleString()}</td></tr>`).join('');

        function calc() {
            const sc = (arr, p) => arr.reduce((acc, x, i) => acc + (document.getElementById(`${p}-${i}`).checked ? x[1] : 0), 0);
            let r = sc(D.rep, 'r'), c = sc(D.eng, 'e') + sc(D.trans, 't') + sc(D.brk, 'b') + sc(D.arm, 'a'), s = sc(D.swap, 's'), m = D.mat.reduce((acc, x, i) => acc + ((parseInt(document.getElementById(`m-${i}`).value) || 0) * x[1]), 0);
            let f = document.getElementById('heli').checked ? 1000000 : 0, b = r + c + s;
            document.getElementById('v-rep').innerText = r.toLocaleString();
            document.getElementById('v-cust').innerText = c.toLocaleString();
            document.getElementById('v-swap').innerText = s.toLocaleString();
            document.getElementById('v-mat').innerText = m.toLocaleString();
            document.getElementById('v-total').innerText = (b + f).toLocaleString();
            document.getElementById('v-civil').innerText = (b + f).toLocaleString();
            document.getElementById('v-pd').innerText = b.toLocaleString();
        }

        function pk(n) { if(!aid) return; let i=document.getElementById(aid); i.value=(i.value==='0'?'':i.value)+n; calc(); }
        function pc() { if(aid) { document.getElementById(aid).value=0; calc(); } }
        function ar() { D.mat.forEach((_,i)=>document.getElementById(`m-${i}`).value=0); calc(); document.getElementById('m-0').focus(); }
        function cr() { ['r','s','e','t','b','a'].forEach(p => D[p==='r'?'rep':p==='s'?'swap':p==='e'?'eng':p==='t'?'trans':p==='b'?'brk':'arm'].forEach((_,i)=>document.getElementById(`${p}-${i}`).checked=false)); document.getElementById('heli').checked=false; calc(); }
        function mv(d) { if(!aid) return; let n = (parseInt(aid.replace('m-', '')) + d + D.mat.length) % D.mat.length; document.getElementById(`m-${n}`).focus(); }
        window.onload = () => { calc(); document.getElementById('m-0').focus(); };
    </script>
</body>
</html>
